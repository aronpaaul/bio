# Rust-бэкенд счётчика заходов (тот же протокол, что был на Express)
[package]
name = "paul-bio-visits"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "visits"
path = "src/main.rs"

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
rand = "0.8"
aes-gcm = "0.10"
hex = "0.4"
sha2 = "0.10"
tower-http = { version = "0.5", features = ["cors", "fs", "set-header"] }
